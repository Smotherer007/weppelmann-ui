<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" version="1.1">
  <!-- Crosspoint — Marken-Zeichen, Stil "Stempel": kraeftige Flaeche aus der Palette,
       darauf eine Strichzeichnung in Knochenweiss, gleiche Strichstaerke fuer alle.
       Eckige Kachel mit abgeschnittenen Ecken: kein Radius. Zwei Stecker, die sich kreuzen. -->
  <title>Crosspoint</title>
  <path d="M 96 16 H 416 L 496 96 V 416 L 416 496 H 96 L 16 416 V 96 Z" fill="#C9862C"/>
  <g fill="none" stroke="#E9E5DC" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Zwei Klinkenstecker, die sich kreuzen: der Name als Bild. -->
    <path d="M 150 150 L 250 250" stroke-width="20"/>
    <path d="M 362 150 L 262 250" stroke-width="20"/>
    <rect x="120" y="120" width="52" height="52" stroke-width="18" transform="rotate(45 146 146)"/>
    <rect x="340" y="120" width="52" height="52" stroke-width="18" transform="rotate(45 366 146)"/>
    <path d="M 256 250 V 300 L 214 342 M 256 300 L 298 342" stroke-width="20"/>
    <circle cx="256" cy="250" r="14" fill="#E9E5DC" stroke-width="0"/>
  </g>
</svg>
